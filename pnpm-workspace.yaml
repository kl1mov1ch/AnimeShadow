packages:
  - "apps/*"
  - "packages/*"

# Dependencies allowed to run install/build scripts.
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  "@swc/core": true
  esbuild: true
  prisma: true
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - "@swc/core"
  - prisma
  - esbuild
