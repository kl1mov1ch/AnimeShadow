services:
  db:
    image: postgres:16-alpine
    container_name: animeshadow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-animeshadow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-animeshadow}
      POSTGRES_DB: ${POSTGRES_DB:-animeshadow}
    # Host port defaults to 5433 to dodge a Postgres already running on 5432.
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - animeshadow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-animeshadow} -d ${POSTGRES_DB:-animeshadow}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  animeshadow-pgdata:
