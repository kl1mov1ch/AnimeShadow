services:
  db:
    image: postgres:16-alpine
    container_name: animeshadow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-animeshadow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-animeshadow}
      POSTGRES_DB: ${POSTGRES_DB:-animeshadow}
    # Host port defaults to 5433 to dodge a Postgres already running on 5432.
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - animeshadow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-animeshadow} -d ${POSTGRES_DB:-animeshadow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Metrics: scrapes the API's /metrics every 15s and keeps 30 days. Bound to
  # localhost only — the admin dashboard reads it through the API
  # (PROMETHEUS_URL), and nothing outside this machine needs to reach it.
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: animeshadow-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/metrics-token:/etc/prometheus/metrics-token:ro
      - animeshadow-prometheus:/prometheus

volumes:
  animeshadow-pgdata:
  animeshadow-prometheus:
