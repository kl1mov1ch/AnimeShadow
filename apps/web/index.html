<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta
      name="description"
      content="AnimeShadow — a screening-room catalogue of anime. Discover what's airing, dig into any title, and keep your own watch list."
    />
    <meta name="theme-color" content="#0a0b10" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- vite-plugin-pwa injects <link rel="manifest"> itself at build time —
         everything below is what iOS specifically needs, since Safari
         reads none of the manifest fields that cover it on every other
         platform (icon, standalone display, status bar tinting). -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- The standards-track name, for Chrome/Edge/other engines that honour
         it — apple-mobile-web-app-capable below is now deprecated in
         Chromium's own eyes, but Safari still only recognises that one, so
         both ship rather than picking one and dropping iOS or everyone else. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AnimeShadow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Warms the connection for the hero's trailer embed before it's needed. -->
    <link rel="preconnect" href="https://www.youtube-nocookie.com" />
    <link rel="dns-prefetch" href="https://i.ytimg.com" />
    <!-- Kodik is the most common watch-player provider — warm its embed
         domain up front so the handshake isn't sitting on the critical path
         the first time a detail page actually needs the iframe. -->
    <link rel="preconnect" href="https://kodikplayer.com" crossorigin />
    <link rel="dns-prefetch" href="https://kodikplayer.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>AnimeShadow</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
