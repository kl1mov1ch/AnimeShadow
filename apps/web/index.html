<!doctype html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta
      name="description"
      content="AnimeShadow — смотреть аниме онлайн бесплатно: онгоинги, топ аниме, фильмы и сериалы с русской озвучкой. Каталог, свой список и прогресс по сериям."
    />
    <meta name="theme-color" content="#0a0b10" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- vite-plugin-pwa injects <link rel="manifest"> itself at build time —
         everything below is what iOS specifically needs, since Safari
         reads none of the manifest fields that cover it on every other
         platform (icon, standalone display, status bar tinting). -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- The standards-track name, for Chrome/Edge/other engines that honour
         it — apple-mobile-web-app-capable below is now deprecated in
         Chromium's own eyes, but Safari still only recognises that one, so
         both ship rather than picking one and dropping iOS or everyone else. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AnimeShadow" />
    <!-- No third-party stylesheet or connection on the critical path: the
         fonts ship with the app from our own origin (see main.tsx). The
         Google Fonts stylesheet that used to be here blocked rendering
         until it arrived — over ten seconds on a bad route to Google, with a
         blank page all that time — and the player's provider is warmed on
         the title page, once its sources are known. -->
    <title>AnimeShadow — смотреть аниме онлайн бесплатно</title>
    <!-- The boot screen: drawn by the HTML alone, before any script or
         stylesheet arrives — on a slow line the page is never blank or
         white. React replaces it the moment the app starts. -->
    <style>
      html, body { margin: 0; background: #0a0b10; }
      .boot { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(60% 50% at 50% 45%, rgba(255, 77, 109, 0.14), transparent 70%), #0a0b10; }
      .boot-mark { position: relative; width: 84px; height: 84px; display: grid; place-items: center; }
      .boot-ring { position: absolute; inset: 0; border-radius: 50%; border: 3px solid rgba(255, 255, 255, 0.07); border-top-color: #ff4d6d; border-right-color: #e879f9; animation: boot-spin 0.9s linear infinite; }
      .boot-glyph { font: 700 38px/1 system-ui, "Segoe UI", sans-serif; color: #ff4d6d; animation: boot-pulse 1.6s ease-in-out infinite; text-shadow: 0 0 18px rgba(255, 77, 109, 0.6); }
      .boot-name { position: absolute; top: calc(50% + 62px); left: 0; right: 0; text-align: center; font: 600 13px/1 system-ui, "Segoe UI", sans-serif; letter-spacing: 0.24em; color: rgba(255, 255, 255, 0.55); text-transform: uppercase; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.88); opacity: 0.7; } }
      @media (prefers-reduced-motion: reduce) { .boot-ring, .boot-glyph { animation-duration: 3s; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" role="status" aria-label="Загрузка"><div class="boot-mark"><span class="boot-ring"></span><span class="boot-glyph">影</span></div><div class="boot-name">AnimeShadow</div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
